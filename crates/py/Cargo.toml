[package]
name = "rsolver"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
rsolver-model = { path = "../model" }
rsolver-lp = { path = "../lp" }
rsolver-driver = { path = "../driver" }
pyo3 = { version = "0.24", features = ["extension-module"] }
