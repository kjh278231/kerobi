[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rsolver"
version = "0.1.0"
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "rsolver._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
